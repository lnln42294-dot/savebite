```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription - SaveBite Yaoundé</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FDFBF7;
            --caramel: #C87D53;
            --sauge: #8A9A86;
            --dark: #333;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--cream);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
        }

        .auth-container {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin: 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo h1 {
            color: var(--caramel);
            font-size: 1.8rem;
            font-weight: 600;
        }

        .logo span {
            color: var(--sauge);
        }

        /* Système d'onglets */
        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid #eee;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #aaa;
            transition: 0.3s;
        }

        .tab.active {
            color: var(--caramel);
            border-bottom: 3px solid var(--caramel);
        }

        /* Formulaires */
        form {
            display: none;
            flex-direction: column;
        }

        form.active {
            display: flex;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #eee;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
            background: #fafafa;
        }

        input:focus, select:focus {
            border-color: var(--sauge);
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .role-option {
            flex: 1;
            position: relative;
        }

        .role-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .role-label {
            display: block;
            text-align: center;
            padding: 10px;
            border: 1.5px solid #eee;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .role-option input:checked + .role-label {
            background-color: var(--sauge);
            color: white;
            border-color: var(--sauge);
        }

        .btn-submit {
            background-color: var(--caramel);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #b06a43;
            transform: translateY(-2px);
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #777;
        }

        .footer-link a {
            color: var(--sauge);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">
            <h1>SaveBite <span>Yaoundé</span></h1>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Connexion</div>
            <div class="tab" onclick="switchTab('register')">Inscription</div>
        </div>

        <!-- Formulaire de Connexion -->
        <form id="login-form" class="active" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="votre@email.com" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Se connecter</button>
            <div class="footer-link">
                Mot de passe oublié ? <a href="#">Réinitialiser</a>
            </div>
        </form>

        <!-- Formulaire d'Inscription -->
        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Nom complet</label>
                <input type="text" placeholder="Jean Dupont" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="votre@email.com" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Je suis un :</label>
                <div class="role-selector">
                    <label class="role-option">
                        <input type="radio" name="role" value="client" checked>
                        <span class="role-label">Client</span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="merchant">
                        <span class="role-label">Commerçant</span>
                    </label>
                </div>
            </div>
            <button type="submit" class="btn-submit">Créer mon compte</button>
        </form>
    </div>

    <script>
        function switchTab(type) {
            const loginTab = document.querySelectorAll('.tab')[0];
            const registerTab = document.querySelectorAll('.tab')[1];
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');

            if (type === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            // Simulation : Par défaut redirige vers index.html
            window.location.href = 'index.html';
        }

        function handleRegister(event) {
            event.preventDefault();
            const roles = document.getElementsByName('role');
            let selectedRole = 'client';
            
            for (const role of roles) {
                if (role.checked) {
                    selectedRole = role.value;
                    break;
                }
            }

            // Redirection selon le profil
            if (selectedRole === 'merchant') {
                window.location.href = 'merchant.html';
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
