<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | SaveBite Yaoundé</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FDFBF7;
            --caramel: #C87D53;
            --sage: #8A9A86;
            --dark: #2D2D2D;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--cream);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--caramel);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: var(--sage);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .auth-card {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid rgba(138, 154, 134, 0.1);
        }

        .tabs {
            display: flex;
            background: #f8f8f8;
            border-bottom: 1px solid #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 1.2rem;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: #888;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--white);
            color: var(--caramel);
            border-bottom: 3px solid var(--caramel);
        }

        .form-container {
            padding: 2.5rem;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #eee;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
            font-size: 1rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--caramel);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--caramel);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background-color: #b06a45;
            transform: translateY(-2px);
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .role-option {
            flex: 1;
            text-align: center;
        }

        .role-option input {
            display: none;
        }

        .role-label {
            display: block;
            padding: 0.8rem;
            border: 1.5px solid #eee;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .role-option input:checked + .role-label {
            border-color: var(--sage);
            background-color: #f1f5f0;
            color: var(--sage);
            font-weight: 600;
        }

        .payment-hint {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">
            🥐 SaveBite Yaoundé
        </a>
        <a href="index.html" class="back-link">← Retour à l'accueil</a>
    </header>

    <div class="auth-card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Se connecter</button>
            <button class="tab-btn" onclick="switchTab('register')">S'inscrire</button>
        </div>

        <div class="form-container">
            <!-- Formulaire Connexion -->
            <form id="loginForm" class="auth-form active" onsubmit="handleAuth(event, 'login')">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn">Connexion</button>
            </form>

            <!-- Formulaire Inscription -->
            <form id="registerForm" class="auth-form" onsubmit="handleAuth(event, 'register')">
                <div class="form-group">
                    <label>Vous êtes ?</label>
                    <div class="role-selector">
                        <div class="role-option">
                            <input type="radio" name="role" value="client" id="roleClient" checked>
                            <label for="roleClient" class="role-label">Client</label>
                        </div>
                        <div class="role-option">
                            <input type="radio" name="role" value="merchant" id="roleMerchant">
                            <label for="roleMerchant" class="role-label">Commerçant</label>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" placeholder="Ex: Jean Douala" required>
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="tel" placeholder="6xx xxx xxx" required>
                    <p class="payment-hint">Compatible MTN & Orange Money</p>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" placeholder="Minimum 8 caractères" required>
                </div>
                <button type="submit" class="submit-btn">Créer mon compte</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(type) {
            const tabs = document.querySelectorAll('.tab-btn');
            const forms = document.querySelectorAll('.auth-form');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            forms.forEach(form => form.classList.remove('active'));

            if(type === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function handleAuth(event, type) {
            event.preventDefault();
            
            let role = 'client';
            if (type === 'register') {
                role = document.querySelector('input[name="role"]:checked').value;
            } else {
                // Pour la démo login, on simule un choix ou on vérifie le profil
                // Ici on redirige par défaut vers index, mais un vrai système vérifierait la DB
                role = 'client'; 
            }

            // Redirection logique
            if (role === 'merchant') {
                window.location.href = 'merchant.html';
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
