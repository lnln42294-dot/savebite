<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | SaveBite Yaoundé</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --creme: #FDFBF7;
            --caramel: #C87D53;
            --sauge: #8A9A86;
            --dark: #2D2D2D;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--creme);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-weight: 700;
            font-size: 24px;
            color: var(--caramel);
            text-decoration: none;
        }

        .back-link {
            text-decoration: none;
            color: var(--sauge);
            font-size: 14px;
            font-weight: 600;
        }

        .auth-card {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            padding: 30px;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            font-weight: 600;
            color: #aaa;
            transition: 0.3s;
        }

        .tab.active {
            color: var(--caramel);
            border-bottom: 3px solid var(--caramel);
        }

        form {
            display: none;
            flex-direction: column;
        }

        form.active {
            display: flex;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #eee;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--sauge);
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: 1.5px solid #eee;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
        }

        .role-option.selected {
            background-color: var(--sauge);
            color: white;
            border-color: var(--sauge);
        }

        .btn-submit {
            background-color: var(--caramel);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }

        /* Radio Buttons Hide */
        .role-radio {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">SaveBite</a>
        <a href="index.html" class="back-link">← Retour</a>
    </header>

    <div class="auth-card">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Se connecter</div>
            <div class="tab" onclick="switchTab('signup')">S'inscrire</div>
        </div>

        <!-- Formulaire de Connexion -->
        <form id="login-form" class="active" onsubmit="handleAuth(event, 'login')">
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="votre@email.com" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Connexion</button>
        </form>

        <!-- Formulaire d'Inscription -->
        <form id="signup-form" onsubmit="handleAuth(event, 'signup')">
            <div class="form-group">
                <label>Je suis un :</label>
                <div class="role-selector">
                    <label class="role-option selected" id="label-client">
                        <input type="radio" name="role" value="client" class="role-radio" checked onclick="selectRole('client')"> 
                        😋 Client
                    </label>
                    <label class="role-option" id="label-merchant">
                        <input type="radio" name="role" value="merchant" class="role-radio" onclick="selectRole('merchant')"> 
                        🏪 Commerçant
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label>Nom complet / Nom Commerce</label>
                <input type="text" placeholder="Ex: Jean Momo ou Boulangerie Centrale" required>
            </div>
            <div class="form-group">
                <label>Téléphone (MTN / Orange Money)</label>
                <input type="tel" placeholder="6xx xxx xxx" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="contact@domaine.cm" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" placeholder="Minimum 8 caractères" required>
            </div>
            <button type="submit" class="btn-submit">Créer mon compte</button>
        </form>

        <p class="footer-text">SaveBite Yaoundé - Anti-gaspillage solidaire</p>
    </div>

    <script>
        function switchTab(type) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabs = document.querySelectorAll('.tab');

            if (type === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                signupForm.classList.add('active');
                loginForm.classList.remove('active');
                tabs[1].classList.add('active');
                tabs[0].classList.remove('active');
            }
        }

        function selectRole(role) {
            document.getElementById('label-client').classList.remove('selected');
            document.getElementById('label-merchant').classList.remove('selected');
            
            if (role === 'client') {
                document.getElementById('label-client').classList.add('selected');
            } else {
                document.getElementById('label-merchant').classList.add('selected');
            }
        }

        function handleAuth(event, type) {
            event.preventDefault();
            
            // Simulation de redirection
            if (type === 'login') {
                // Par défaut redirige vers index client
                window.location.href = 'index.html';
            } else {
                const role = document.querySelector('input[name="role"]:checked').value;
                if (role === 'merchant') {
                    window.location.href = 'merchant.html';
                } else {
                    window.location.href = 'index.html';
                }
            }
        }
    </script>
</body>
</html>
