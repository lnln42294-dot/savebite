<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification - SaveBite Yaoundé</title>
    <style>
        :root {
            --bg-cream: #FDFBF7;
            --caramel: #C87D53;
            --caramel-dark: #a66642;
            --sage: #8A9A86;
            --white: #ffffff;
            --gray: #666;
            --border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* En-tête */
        header {
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--caramel);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back {
            text-decoration: none;
            color: var(--sage);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }

        .btn-back:hover {
            color: var(--caramel);
        }

        /* Conteneur Principal */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* Onglets */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 1.2rem;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--gray);
            transition: all 0.3s;
            background: #f9f9f9;
        }

        .tab.active {
            background: var(--white);
            color: var(--caramel);
            border-bottom: 3px solid var(--caramel);
        }

        /* Formulaires */
        .form-container {
            padding: 2rem;
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--sage);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--caramel);
        }

        /* Rôle Selector */
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .role-option {
            position: relative;
        }

        .role-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .role-label {
            display: block;
            text-align: center;
            padding: 0.7rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .role-option input:checked + .role-label {
            background-color: var(--sage);
            color: white;
            border-color: var(--sage);
        }

        /* Bouton Action */
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background-color: var(--caramel);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background-color: var(--caramel-dark);
        }

        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--gray);
        }

        .footer-note span {
            color: var(--caramel);
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-card {
                box-shadow: none;
                border-radius: 0;
            }
            body {
                background-color: var(--white);
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <span style="font-size: 1.8rem;">🥐</span> SaveBite Yaoundé
        </a>
        <a href="index.html" class="btn-back">← Retour</a>
    </header>

    <main>
        <div class="auth-card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">Connexion</div>
                <div class="tab" onclick="switchTab('register')">Créer un compte</div>
            </div>

            <!-- Formulaire Connexion -->
            <div id="login-form" class="form-container active">
                <form onsubmit="handleAuth(event, 'login')">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="votre@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-pass">Mot de passe</label>
                        <input type="password" id="login-pass" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-submit">Se connecter</button>
                </form>
                <p class="footer-note">Ravi de vous revoir sur <span>SaveBite</span>.</p>
            </div>

            <!-- Formulaire Inscription -->
            <div id="register-form" class="form-container">
                <form onsubmit="handleAuth(event, 'register')">
                    <label>Je suis un :</label>
                    <div class="role-selector">
                        <div class="role-option">
                            <input type="radio" name="role" id="role-client" value="client" checked>
                            <label for="role-client" class="role-label">Client</label>
                        </div>
                        <div class="role-option">
                            <input type="radio" name="role" id="role-merchant" value="merchant">
                            <label for="role-merchant" class="role-label">Commerçant</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-name">Nom complet / Nom d'enseigne</label>
                        <input type="text" id="reg-name" placeholder="Ex: Jean Douala ou Boulangerie du Centre" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-phone">Numéro de téléphone (MTN / Orange Money)</label>
                        <input type="tel" id="reg-phone" placeholder="6xx xxx xxx" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" placeholder="votre@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-pass">Mot de passe</label>
                        <input type="password" id="reg-pass" placeholder="Minimum 8 caractères" required>
                    </div>

                    <button type="submit" class="btn-submit">Créer mon compte</button>
                </form>
                <p class="footer-note">En vous inscrivant, vous aidez à réduire le gaspillage à Yaoundé.</p>
            </div>
        </div>
    </main>

    <script>
        function switchTab(type) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Update forms
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
            if (type === 'login') {
                document.getElementById('login-form').classList.add('active');
            } else {
                document.getElementById('register-form').classList.add('active');
            }
        }

        function handleAuth(event, type) {
            event.preventDefault();
            
            // Logique de redirection simple pour la démo
            let role = 'client';
            if (type === 'register') {
                role = document.querySelector('input[name="role"]:checked').value;
            } else {
                // Pour la connexion simple, on simule un client par défaut 
                // (Dans une vraie app, cela viendrait de la DB)
                role = 'client'; 
            }

            if (role === 'merchant') {
                window.location.href = 'merchant.html';
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
