<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveBite - Connexion & Inscription</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            creme: '#FDFBF7',
            caramel: '#C87D53',
            sauge: '#8A9A86'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-creme min-h-screen flex flex-col justify-between text-gray-800">

  <!-- Header -->
  <header class="p-6 flex justify-between items-center max-w-6xl mx-auto w-full">
    <div class="flex items-center space-x-2">
      <span class="text-2xl font-bold text-caramel">🌱 SaveBite</span>
    </div>
    <a href="index.html" class="text-sm font-semibold text-sauge hover:underline">← Retour aux offres</a>
  </header>

  <!-- Form Card -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 max-w-md w-full">
      
      <!-- Tabs -->
      <div class="flex border-b mb-6">
        <button id="btn-login" onclick="switchTab('login')" class="w-1/2 pb-3 font-semibold text-caramel border-b-2 border-caramel text-center">Connexion</button>
        <button id="btn-register" onclick="switchTab('register')" class="w-1/2 pb-3 font-semibold text-gray-400 border-b-2 border-transparent text-center">Créer un compte</button>
      </div>

      <!-- Connexion Form -->
      <form id="form-login" class="space-y-4" onsubmit="event.preventDefault(); window.location.href='index.html';">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email ou Téléphone</label>
          <input type="text" required placeholder="6XX XX XX XX" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-caramel">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
          <input type="password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-caramel">
        </div>
        <button type="submit" class="w-full bg-caramel text-white py-3 rounded-lg font-semibold hover:opacity-90 transition">Se connecter</button>
      </form>

      <!-- Inscription Form -->
      <form id="form-register" class="space-y-4 hidden" onsubmit="event.preventDefault(); window.location.href='index.html';">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Vous êtes :</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" class="border p-2 rounded-lg text-sm font-semibold border-caramel text-caramel bg-amber-50">Client</button>
            <button type="button" class="border p-2 rounded-lg text-sm font-semibold border-gray-200 text-gray-600">Commerçant</button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nom complet</label>
          <input type="text" required placeholder="Jean Dupont" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-caramel">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Numéro Mobile Money (MTN / Orange)</label>
          <input type="tel" required placeholder="6XX XX XX XX" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-caramel">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
          <input type="password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-caramel">
        </div>
        <button type="submit" class="w-full bg-sauge text-white py-3 rounded-lg font-semibold hover:opacity-90 transition">Créer mon compte</button>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="p-4 text-center text-xs text-gray-400">
    © 2026 SaveBite Yaoundé - Anti-gaspillage alimentaire
  </footer>

  <script>
    function switchTab(type) {
      const loginForm = document.getElementById('form-login');
      const registerForm = document.getElementById('form-register');
      const btnLogin = document.getElementById('btn-login');
      const btnRegister = document.getElementById('btn-register');

      if (type === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        btnLogin.className = "w-1/2 pb-3 font-semibold text-caramel border-b-2 border-caramel text-center";
        btnRegister.className = "w-1/2 pb-3 font-semibold text-gray-400 border-b-2 border-transparent text-center";
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        btnRegister.className = "w-1/2 pb-3 font-semibold text-caramel border-b-2 border-caramel text-center";
        btnLogin.className = "w-1/2 pb-3 font-semibold text-gray-400 border-b-2 border-transparent text-center";
      }
    }
  </script>
</body>
</html>
